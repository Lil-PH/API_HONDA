    <!-- Defensive shim for window.fetch property descriptor in sandboxed iframe environments -->
    <script>
      (function() {
        try {
          var proto = window;
          var descriptor = Object.getOwnPropertyDescriptor(proto, 'fetch');
          if (!descriptor && window.Window && window.Window.prototype) {
            descriptor = Object.getOwnPropertyDescriptor(window.Window.prototype, 'fetch');
            proto = window.Window.prototype;
          }
          if (descriptor && !descriptor.set) {
            var currentFetch = window.fetch;
            Object.defineProperty(proto, 'fetch', {
              get: function() {
                return currentFetch;
              },
              set: function(val) {
                currentFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (err) {
          // Fallback ignore
        }
      })();
    </script>
