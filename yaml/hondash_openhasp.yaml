# ==============================================================================
# HonDASH Cyber HUD - OpenHASP Declarative Layout (YAML / JSONL)
# Platform: ESP32 OpenHASP Firmware
# Target: 320x240 Display (ESP32-CYD)
# ==============================================================================

plate:
